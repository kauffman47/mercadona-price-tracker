name: Update Mercadona catalog

on:
  workflow_dispatch:

  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Mercadona catalog
        env:
          MERCADONA_POSTCODE: ${{ secrets.MERCADONA_POSTCODE }}
        run: python tracker.py

      - name: Update price history
        run: python update_history.py

      - name: Show summary
        run: |
          echo "Catálogo actual:"
          wc -l data/current_catalog.csv

          echo ""
          echo "Histórico de precios:"
          wc -l data/price_history.csv

      - name: Save data in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/current_catalog.csv
          git add data/price_history.csv

          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Update Mercadona prices"
            git push
          fi
