name: Update Mercadona catalog

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Mercadona catalog
        env:
          MERCADONA_POSTCODE: ${{ secrets.MERCADONA_POSTCODE }}
        run: python tracker.py

      - name: Show catalog summary
        run: |
          echo "Número de líneas:"
          wc -l data/current_catalog.csv

          echo ""
          echo "Primeras 3 líneas:"
          head -n 3 data/current_catalog.csv

      - name: Save catalog in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/current_catalog.csv

          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Update Mercadona catalog"
            git push
          fi
